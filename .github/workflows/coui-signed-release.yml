name: PiliNara COUI signed preview release

on:
  push:
    branches:
      - release/coui-2.2.0-preview.1

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check release signing configuration
        env:
          SIGN_KEYSTORE_BASE64: ${{ secrets.SIGN_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for name in SIGN_KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required signing secret: $name"
              exit 1
            fi
          done
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/*.gradle*
            android/**/gradle-wrapper.properties
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      - name: Apply project patches
        shell: pwsh
        run: lib/scripts/patch.ps1 android
        continue-on-error: true
      - name: Configure release signing
        env:
          SIGN_KEYSTORE_BASE64: ${{ secrets.SIGN_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          umask 077
          printf '%s' "$SIGN_KEYSTORE_BASE64" | base64 --decode > android/app/key.jks
          python3 - <<'PY'
          import os
          def prop(value):
              return value.replace('\\', '\\\\').replace('\n', '\\n').replace('\r', '\\r').replace('=', '\\=').replace(':', '\\:')
          with open('android/key.properties', 'w', encoding='iso-8859-1') as f:
              f.write('storeFile=key.jks\n')
              for key, env in [('storePassword','KEYSTORE_PASSWORD'), ('keyAlias','KEY_ALIAS'), ('keyPassword','KEY_PASSWORD')]:
                  f.write(key + '=' + prop(os.environ[env]) + '\n')
          PY
      - name: Set build metadata
        shell: pwsh
        run: lib/scripts/build.ps1 android
      - name: Build signed arm64 APK
        run: |
          flutter build apk --release --target-platform android-arm64 \
            --build-name 2.2.0-coui.1 --build-number "$((100000 + GITHUB_RUN_NUMBER))" \
            --dart-define-from-file=pili_release.json --pub
          cp build/app/outputs/flutter-apk/app-release.apk PiliNara-2.2.0-coui.1-arm64.apk
      - name: Verify signing certificate
        shell: bash
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)"
          "$APKSIGNER" verify --verbose --print-certs PiliNara-2.2.0-coui.1-arm64.apk
          sha256sum PiliNara-2.2.0-coui.1-arm64.apk
      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v2.2.0-coui.1
          name: PiliNara 2.2.0 COUI Preview 1
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            COUI 风格预览版，仅包含首批界面样板；全应用迁移尚未完成。
            后续覆盖升级需要保持同一签名和包名，并使用更高的版本代码。
          files: PiliNara-2.2.0-coui.1-arm64.apk
